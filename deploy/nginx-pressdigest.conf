# Reverse proxy + static asset serving for PressDigest, in front of
# uvicorn on 127.0.0.1:8000. Basic auth is set at server level so it
# applies to every location below without needing to repeat it -
# non-negotiable: this serves The Hindu's verbatim text and PDF, and must
# never be reachable without a login. See setup.sh for how the htpasswd
# file gets created.
#
# Install: cp this file to /etc/nginx/sites-available/pressdigest, symlink
# into sites-enabled, remove the default site - setup.sh does all of this.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    auth_basic "PressDigest - private, authorized access only";
    auth_basic_user_file /etc/nginx/pressdigest.htpasswd;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss text/xml image/svg+xml;

    # The Hindu's e-paper PDFs run ~20MB in practice - comfortable margin
    # above that for uploads.
    client_max_body_size 64M;

    # Vite's build gives every asset a content hash in its filename
    # (index-XXXXXXXX.js), so a given URL never changes meaning - safe to
    # cache for a year. Served directly from disk, bypassing uvicorn
    # entirely, since the e2-micro's shared-core CPU shouldn't spend
    # cycles on a Python process for a static file nginx can serve itself.
    location /assets/ {
        alias /opt/pressdigest/app/frontend/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.svg {
        alias /opt/pressdigest/app/frontend/dist/favicon.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /icons.svg {
        alias /opt/pressdigest/app/frontend/dist/icons.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    # The raw PDF for an edition is immutable once uploaded (there's no
    # edit/replace flow) - cached for a week. Egress is the tightest
    # budget on this deployment (1 GB/month free tier) and a ~20MB PDF
    # re-downloaded on every reader-page visit would burn through it fast;
    # this is a proxied route (FastAPI streams the file), not a static
    # one, so the cache header is added here rather than served from disk.
    location ~ ^/api/editions/[^/]+/pdf$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }

    # Everything else - /api/* routes and every client-side route
    # (/pipeline, /summaries, /reader/...) - proxies to uvicorn, which has
    # its own SPA-fallback catch-all for the latter (see main.py) so this
    # works correctly even without nginx in front (e.g. testing locally).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
